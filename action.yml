name: "LogDrop Taint"
description: "Taint (data-flow) analysis for iOS/Swift source code. Your source never leaves the runner; only SARIF is produced."
author: "Initial Code Software Solutions"

branding:
  icon: shield
  color: blue

inputs:
  license:
    description: "Your LogDrop licence key. Keep it in a repository secret and pass it here. It is verified offline; no data is sent anywhere."
    required: true
  path:
    description: "The .swift file or directory to scan, relative to the repository root."
    required: false
    default: "."
  repo-root:
    description: "The root that SARIF paths are relative to. Code Scanning can bind a finding to a file only through a repo-root path."
    required: false
    default: ${{ github.workspace }}
  sarif-file:
    description: "Path of the SARIF file to write."
    required: false
    default: "logdrop-taint.sarif"
  fail-on-findings:
    description: "Fail the step when there are findings. Use it as a CI gate."
    required: false
    default: "false"
  annotations:
    description: "Show findings as a box above the line in the pull request. Free; no Code Scanning licence needed."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload the SARIF to Code Scanning. If Code Scanning is off on your repository the step warns and moves on rather than breaking the build."
    required: false
    default: "true"
  panel-url:
    description: "The panel address, if reports should be sent to the LogDrop panel. LEFT EMPTY, nothing is sent (the default). The only thing sent is the SARIF, never your source."
    required: false
    default: ""
  bundle-id:
    description: "The application id (e.g. com.company.app). Required when panel-url is set — the panel merges binary and source reports into one app under it."
    required: false
    default: ""
  fail-on-delivery-error:
    description: "Fail the step when the report could not be sent to the panel. OFF by default: a panel that is down, a licence moved between projects, or a bundle id deleted in the panel are not things the developer who opened this pull request can fix, and blocking them ends with the action being removed from the pipeline. Turn it on if you want delivery guaranteed."
    required: false
    default: "false"
  snippets:
    description: "Include the offending line and ±2 lines of context in the report (on by default). Set to 'false' and the report carries only the rule and file:line — not a fragment of your code leaves."
    required: false
    default: "true"
  leaks:
    description: "Report memory and resource leaks as well as security findings (on by default). Set to 'false' to switch it off; it adds roughly 30% to scan time."
    required: false
    default: "true"
  analyzer-version:
    description: "Which analyzer version to download. The default is the one tested with this action release — you should not need to change it."
    required: false
    default: "v1.24.0"

outputs:
  sarif-file:
    description: "Path of the SARIF file that was written."
    value: ${{ inputs.sarif-file }}
  findings:
    description: "How many findings were reported."
    value: ${{ steps.scan.outputs.findings }}
  report-id:
    description: "Identifier of the report the panel stored. Empty when no panel-url was given, or when the send failed."
    value: ${{ steps.panel.outputs.report-id }}

runs:
  using: composite
  steps:
    # The analyzer arrives prebuilt: nothing is compiled on the customer's machine
    # (~4 minutes saved) and no access to the source is required.
    - name: Download the analyzer
      id: fetch
      shell: bash
      env:
        VERSION: ${{ inputs.analyzer-version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid analyzer-version: '$VERSION' (expected format: v1.2.3)"
          exit 1
        fi

        dir="$RUNNER_TEMP/logdrop-taint/$VERSION"
        mkdir -p "$dir"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

        # Do not download again if the action is used more than once in a workflow.
        if [ -x "$dir/logdrop-taint" ]; then
          echo "Reusing the cached copy: $VERSION"
          exit 0
        fi

        archive="logdrop-taint-${VERSION}-macos-universal.tar.gz"
        base="https://github.com/initialcodess/logdrop-taint-ios-action/releases/download/${VERSION}"

        curl -fsSL --retry 3 --retry-delay 2 -o "$dir/$archive" "$base/$archive"
        curl -fsSL --retry 3 --retry-delay 2 -o "$dir/$archive.sha256" "$base/$archive.sha256"

        # Integrity: the downloaded archive must be byte-identical to the published one.
        ( cd "$dir" && shasum -a 256 -c "$archive.sha256" )

        tar -xzf "$dir/$archive" -C "$dir"
        chmod +x "$dir/logdrop-taint"
        "$dir/logdrop-taint" --version

    - name: Run the scan
      id: scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # The key goes in the environment, not on the command line: command lines can
        # show up in run logs and in the process list.
        LOGDROP_LICENSE: ${{ inputs.license }}
        BIN_DIR: ${{ steps.fetch.outputs.dir }}
        SCAN_PATH: ${{ inputs.path }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        REPO_ROOT: ${{ inputs.repo-root }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        ANNOTATIONS: ${{ inputs.annotations }}
        SNIPPETS: ${{ inputs.snippets }}
        LEAKS: ${{ inputs.leaks }}
      run: |
        set -o pipefail
        args=("$SCAN_PATH" --sarif "$SARIF_FILE" --repo-root "$REPO_ROOT" --verbose)
        [ "$FAIL_ON_FINDINGS" = "true" ] && args+=(--fail-on-findings)
        [ "$ANNOTATIONS" = "true" ] && args+=(--github-annotations)
        # Both flags go in EXPLICITLY, in whichever direction the input asks for,
        # rather than only when the input differs from the analyzer's default.
        # Passing only the odd one out makes the action's promise "whatever the
        # binary does today": the day a default changes, `snippets: true` or
        # `leaks: false` becomes a request this action never makes, and the customer
        # gets the opposite of what their workflow says while nothing errors.
        if [ "$SNIPPETS" = "false" ]; then args+=(--no-snippets); else args+=(--snippets); fi
        if [ "$LEAKS" = "true" ]; then args+=(--leaks); else args+=(--no-leaks); fi

        # PRESERVE the exit code: 0 clean · 1 findings · 2 licence. Each means something different.
        set +e
        "$BIN_DIR/logdrop-taint" "${args[@]}" | tee scan-output.txt
        status=${PIPESTATUS[0]}
        set -e

        findings=$(sed -n 's/^LogDrop Taint: \([0-9]*\) finding.*/\1/p' scan-output.txt | head -1)
        findings=${findings:-0}
        echo "findings=$findings" >> "$GITHUB_OUTPUT"

        {
          echo "## LogDrop Taint"
          echo ""
          if [ "$findings" -eq 0 ]; then
            echo "No findings."
          else
            echo "**$findings finding(s).**"
            echo ""
            echo "| Location | Rule | Finding |"
            echo "|---|---|---|"
            sed -n 's/^  \[\([^]]*\)\] \([^ ]*\) — \(.*\)$/| `\2` | \1 | \3 |/p' scan-output.txt
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # The flag is written BEFORE exiting so it survives a --fail-on-findings exit.
        if [ -f "$SARIF_FILE" ]; then
          echo "sarif-written=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-written=false" >> "$GITHUB_OUTPUT"
        fi
        rm -f scan-output.txt
        exit $status

    # Code Scanning is free on public repositories and depends on a paid licence on
    # private ones. On a customer without one the upload step errors and would break
    # the build even though the scan SUCCEEDED. So we probe and pass with a warning:
    # finding reporting (inline boxes + job summary + exit code) is unaffected.
    - name: Is Code Scanning available
      id: codescanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-written == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        code=$(curl -sS -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=1" || echo 000)
        case "$code" in
          403|404)
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SARIF not uploaded::Code Scanning is unavailable on this repository (HTTP $code). On private repositories it needs a paid Code Security licence, and your workflow needs the 'security-events: write' permission. The scan ran — the findings appear in the inline annotations and the job summary."
            ;;
          *) echo "available=true" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Upload the SARIF to Code Scanning
      if: ${{ always() && steps.codescanning.outputs.available == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: logdrop-taint

    # Reporting to the LogDrop panel — OPTIONAL, OFF by default.
    #
    # Privacy: the only thing sent is the SARIF (rule + file + line). The source text
    # neither enters the SARIF nor gets sent. File PATHS do leave the machine, though,
    # so the decision belongs to the customer and the default is off.
    #
    # The network call lives here, NOT in the analyzer: the binary contacts no server,
    # which is how the promise "the program tells nobody it ran" is kept.
    #
    # always(): with fail-on-findings the scan step exits 1. That is exactly when the
    # report matters — when there are findings.
    #
    # NOTHING HERE BREAKS THE BUILD BY DEFAULT, and that is a decision with a reason.
    # The earlier split — a rejected report failed the build, an unreachable panel did
    # not — rested on "a 400 is your own fault". It is not always: a bundle id deleted
    # or renamed in the panel, or a licence moved to another project, answers 400 too,
    # and the developer whose pull request goes red cannot fix any of them. The action
    # cannot tell those apart from a typo. The two ways to be wrong do not cost the
    # same — a build blocked for a reason the team cannot fix ends with the action
    # removed from the pipeline, while a report that did not arrive is bad but blocks
    # nobody and is answered with visibility. So delivery is advisory, loudly, and
    # `fail-on-delivery-error` is there for anyone who wants the hard gate.
    #
    # The step no longer waits on `sarif-written`. That condition skipped it in
    # SILENCE — the one outcome the contract above exists to remove — and it was
    # also the one place where this action and examples/report-to-panel.sh disagreed
    # about a condition rather than about a message: the script has always announced
    # a missing report. It is a branch here now, like every other way to fail.
    - name: Notify the panel
      id: panel
      if: ${{ always() && inputs.panel-url != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PANEL_URL: ${{ inputs.panel-url }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        LICENSE: ${{ inputs.license }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        APP_NAME: ${{ github.event.repository.name }}
        COMMIT: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
        FAIL_ON_DELIVERY: ${{ inputs.fail-on-delivery-error }}
      run: |
        set -uo pipefail

        # Set when the report did not reach the panel, whatever the cause. One flag
        # rather than a per-code policy: "did your report arrive" is the question a
        # team can act on, and a rule that needs a table to explain gets misread.
        failed=""
        reason=""

        if [ -z "$BUNDLE_ID" ]; then
          failed=1
          reason="panel-url was given but bundle-id was not. The panel uses bundle-id to decide which application a report belongs to."
        elif [ ! -f "$SARIF_FILE" ]; then
          failed=1
          reason="No report at '$SARIF_FILE' — the scan wrote nothing to send."
        else
          url="${PANEL_URL%/}/api/reports/sarif"
          body="$RUNNER_TEMP/panel-response.txt"
          : > "$body"

          # `|| code=000` IS LOAD-BEARING, and not the same as `|| echo 000`.
          #
          # GitHub runs `shell: bash` as `bash --noprofile --norc -e -o pipefail`. The
          # `set -uo pipefail` above adds u and pipefail; it does NOT clear `-e`. Under
          # `-e` an assignment from a command substitution carries the command's exit
          # status, so when curl cannot connect (exit 7) THE STEP DIES ON THIS LINE:
          # `000` is never assigned, the `000)` branch never runs, the
          # fail-on-delivery-error gate is skipped entirely, and the build fails with
          # curl's code — breaking the one promise this step exists to keep, in the most
          # likely failure there is. A command that is part of a `||` list is exempt from
          # `-e`, which is what makes the fix work.
          #
          # It must be `|| code=000`, NOT `|| echo 000`. curl's -w already prints "000"
          # when it cannot connect; appending another to stdout yields "000000", which
          # matches no branch below and falls through to the catch-all. Assigning the
          # variable replaces that output instead of adding to it. Both spellings look
          # equivalent and only one is.
          code=$(curl -sS -o "$body" -w '%{http_code}' -X POST "$url" \
            -H "Authorization: Bearer $LICENSE" \
            -F "sarif=@$SARIF_FILE" \
            -F "bundle_id=$BUNDLE_ID" \
            -F "app_name=$APP_NAME" \
            -F "version=$REF_NAME" \
            -F "commit=$COMMIT") || code=000
          # Same trap as the line above, and it bit immediately: when curl never
          # connected there is no response file, `head` fails, and `-e` kills the step
          # before the 000 branch can run. Creating the file up front is not enough on
          # its own — the guard is what makes it survive any other read failure.
          detail=$(head -c 300 "$body" 2>/dev/null) || detail=""

          case "$code" in
            200|201)
              # The id the panel filed the report under. Printing "sent" and nothing else
              # leaves no way to reach the report — a customer cannot search the tenant's
              # report list, and we have had to look one up by hand three times.
              # `sed` rather than `jq` or `python3`: neither is guaranteed on a customer's
              # runner, and this must not be the line that fails.
              report_id=$(sed -n 's/.*"report_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$body" | head -1)
              if [ -n "$report_id" ]; then
                echo "report-id=$report_id" >> "$GITHUB_OUTPUT"
                echo "::notice title=LogDrop panel::Report $report_id was stored by the panel."
                echo "LogDrop panel report: \`$report_id\`" >> "$GITHUB_STEP_SUMMARY"
              else
                # Accepted, but we cannot say what was stored. NOT counted as a delivery
                # failure — the panel said it took the report — but not silent either,
                # because "sent" with no id reads as success and leaves nothing to open.
                echo "::warning title=Panel report id missing::The panel accepted the report but returned no id: $detail"
              fi
              ;;
            401)
              reason="The panel could not read the licence key (401). Check the licence secret — a line break in the value is the usual cause."
              failed=1
              ;;
            403)
              # 403 carries two causes: expired OR revoked. Saying "renew it" would be
              # misleading for a revocation, so the panel's own explanation is shown.
              reason="The panel did not accept the licence (403): $detail — it may be expired or revoked. satis@initialcode.io"
              failed=1
              ;;
            400|422)
              reason="The panel rejected the report ($code): $detail — check that the bundle id is registered for this project and that the licence covers it. Nothing was stored."
              failed=1
              ;;
            413)
              reason="The report exceeded the panel's size limit (413). Narrow the scan with 'exclude' in .logdrop.json to drop generated code."
              failed=1
              ;;
            503)
              reason="The panel is currently unavailable (503). The scan was unaffected; the next run will try again."
              failed=1
              ;;
            000)
              reason="The panel could not be reached ($PANEL_URL). The scan was unaffected."
              failed=1
              ;;
            *)
              reason="The panel returned $code: $detail"
              failed=1
              ;;
          esac
          rm -f "$body"
        fi

        if [ -n "$failed" ]; then
          # report-id stays EMPTY on purpose, and is written explicitly so the intent is
          # visible: a workflow can gate its own step on it without parsing any log.
          echo "report-id=" >> "$GITHUB_OUTPUT"
          echo "::warning title=LogDrop report NOT sent to the panel::$reason"

          # Placed before OUR OWN output, which means before the findings table the scan
          # step already appended. That is the whole claim, and it is deliberately not
          # "at the top of the job summary": $GITHUB_STEP_SUMMARY is append-only, any
          # later step in the customer's workflow adds below us, and a promise about
          # THEIR ordering is one we cannot keep. The warning above is what actually
          # puts this at the top — GitHub groups annotations in their own block, so
          # prominence comes from the channel, not from byte order in a file.
          #
          # Rewriting the file is the only way to get ahead of a previous step's text.
          # If that fails for any reason, append instead: being in the wrong position
          # is a small loss, losing the warning entirely is not.
          notice="$RUNNER_TEMP/logdrop-summary.md"
          {
            echo "> [!WARNING]"
            echo "> **LogDrop: the report was NOT sent to the panel.**"
            echo ">"
            echo "> $reason"
            echo ""
            [ -f "$GITHUB_STEP_SUMMARY" ] && cat "$GITHUB_STEP_SUMMARY"
          } > "$notice" && mv "$notice" "$GITHUB_STEP_SUMMARY" || {
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> **LogDrop: the report was NOT sent to the panel.** $reason" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$FAIL_ON_DELIVERY" = "true" ]; then
            echo "::error title=LogDrop delivery failed::fail-on-delivery-error is on, so this is a build failure."
            exit 1
          fi
        fi

        exit 0
