# CircleCI — LogDrop Taint
#
# Adapt this into your project's .circleci/config.yml.
#
# REQUIREMENT: a macOS executor. On CircleCI macOS comes with the paid plans; if you
# already build iOS you are using one, and the scan slots into that job rather than
# needing a machine of its own.
#
# LICENCE: define an environment variable named `LOGDROP_LICENSE` in the CircleCI
# project settings (Project Settings → Environment Variables). Do NOT put it in config.
#
# SENDING TO THE PANEL (optional) — three variables, and all three are needed:
#
#   PANEL_URL        your panel's address
#   LOGDROP_LICENSE  your key (already required for the scan)
#   BUNDLE_ID        your application's bundle id, AS REGISTERED IN THE PANEL
#
# Miss any one and nothing is sent: the step prints a line and stays green,
# which is easy not to notice. A BUNDLE_ID the panel does not recognise for
# this project is refused (400) and FAILS the step, so a wrong id is loud
# rather than silent.
# Set all three in Project Settings → Environment Variables.
version: 2.1

jobs:
  security-scan:
    macos:
      xcode: "16.0"
    steps:
      - checkout

      # Cache the binary per version: no need to download it on every run.
      - restore_cache:
          keys:
            - logdrop-taint-v1.24.1

      - run:
          name: Install LogDrop Taint
          command: |
            LOGDROP_VERSION=v1.24.1 \
            LOGDROP_BIN_DIR="$HOME/.logdrop/bin" \
            bash examples/install-logdrop-taint.sh

      - save_cache:
          key: logdrop-taint-v1.24.1
          paths:
            - ~/.logdrop/bin

      - run:
          name: Scan the source
          command: |
            "$HOME/.logdrop/bin/logdrop-taint" Sources \
              --sarif logdrop-taint.sarif \
              --repo-root "$PWD" \
              --verbose \
              --fail-on-findings
          # Exit code 1 means findings → the step fails → the pull request is blocked.
          # 2 is the licence, 3 is a config error. Each means something different.

      # Send it to the panel, if you use one. Runs even though the scan step failed:
      # a report with findings is the one that matters most. Without PANEL_URL set
      # in the project's environment variables this step prints a line and does
      # nothing, so it is safe to leave in.
      - run:
          name: Report to the LogDrop panel
          when: always
          command: |
            PANEL_URL="${PANEL_URL:-}" BUNDLE_ID="${BUNDLE_ID:-}" \
            APP_NAME="$CIRCLE_PROJECT_REPONAME" \
            VERSION="$CIRCLE_BRANCH" COMMIT="$CIRCLE_SHA1" \
              bash examples/report-to-panel.sh logdrop-taint.sarif

      # Keep the report either way: with findings the step failed, and that is exactly
      # when you want to read it.
      - store_artifacts:
          path: logdrop-taint.sarif
          destination: logdrop-taint.sarif

workflows:
  security:
    jobs:
      - security-scan
