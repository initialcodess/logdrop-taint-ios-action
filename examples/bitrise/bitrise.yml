# Bitrise — LogDrop Taint
#
# Bitrise already runs on a macOS stack, so there is nothing extra to require.
#
# LICENCE: add `LOGDROP_LICENSE` under Secrets in Bitrise (consider leaving "Expose
# for pull requests" off — handing secrets to fork pull requests is risky).
#
# SENDING TO THE PANEL (optional) — three variables, and all three are needed:
#
#   PANEL_URL        your panel's address
#   LOGDROP_LICENSE  your key (already required for the scan)
#   BUNDLE_ID        your application's bundle id, AS REGISTERED IN THE PANEL
#
# Miss any one and nothing is sent: the step prints a line and stays green,
# which is easy not to notice. A BUNDLE_ID the panel does not recognise for
# this project is refused (400) and FAILS the step, so a wrong id is loud
# rather than silent.
# Set all three under Secrets, next to the licence key.
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  security-scan:
    envs:
      - LOGDROP_VERSION: v1.24.1
      - LOGDROP_BIN_DIR: $BITRISE_SOURCE_DIR/.logdrop/bin
    steps:
      - activate-ssh-key: {}
      - git-clone: {}
      - cache-pull: {}
      - script:
          title: Install LogDrop Taint
          inputs:
            - content: bash examples/install-logdrop-taint.sh
      - script:
          title: Scan the source
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                "$LOGDROP_BIN_DIR/logdrop-taint" Sources \
                  --sarif "$BITRISE_DEPLOY_DIR/logdrop-taint.sarif" \
                  --repo-root "$BITRISE_SOURCE_DIR" \
                  --verbose \
                  --fail-on-findings
      - script:
          title: Report to the LogDrop panel
          is_always_run: true
          inputs:
            - content: |
                #!/usr/bin/env bash
                # Does nothing unless PANEL_URL is set in Secrets.
                APP_NAME="$BITRISE_APP_TITLE" VERSION="$BITRISE_GIT_BRANCH" \
                COMMIT="$BITRISE_GIT_COMMIT" \
                  bash examples/report-to-panel.sh "$BITRISE_DEPLOY_DIR/logdrop-taint.sarif"
      - cache-push:
          inputs:
            - cache_paths: $LOGDROP_BIN_DIR
      - deploy-to-bitrise-io:
          is_always_run: true      # findings fail the step; upload the report anyway
