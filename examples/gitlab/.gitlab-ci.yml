# GitLab CI — LogDrop Taint
#
# REQUIREMENT: a macOS runner. GitLab's SaaS macOS runners are paid; registering
# your own Mac as a runner costs nothing extra (which is what iOS teams usually
# do anyway).
#
# LICENCE: define `LOGDROP_LICENSE` under Settings → CI/CD → Variables and tick
# "Masked". Do NOT write the key into this file.
#
# SENDING TO THE PANEL (optional) — three variables, and all three are needed:
#
#   PANEL_URL        your panel's address
#   LOGDROP_LICENSE  your key (already required for the scan)
#   BUNDLE_ID        your application's bundle id, AS REGISTERED IN THE PANEL
#
# Miss any one and nothing is sent: the step prints a line and stays green,
# which is easy not to notice. A BUNDLE_ID the panel does not recognise for
# this project is refused (400) and FAILS the step, so a wrong id is loud
# rather than silent.
# Set all three under Settings → CI/CD → Variables.
security-scan:
  stage: test
  tags:
    - macos            # the tag of your own macOS runner
  variables:
    LOGDROP_VERSION: "v1.24.1"
    LOGDROP_BIN_DIR: "$CI_PROJECT_DIR/.logdrop/bin"
  cache:
    key: "logdrop-taint-$LOGDROP_VERSION"
    paths:
      - .logdrop/bin/
  script:
    - bash examples/install-logdrop-taint.sh
    - |
      "$LOGDROP_BIN_DIR/logdrop-taint" Sources \
        --sarif logdrop-taint.sarif \
        --repo-root "$CI_PROJECT_DIR" \
        --verbose \
        --fail-on-findings
  after_script:
    # Runs whether the scan passed or failed. Does nothing unless PANEL_URL is set
    # under Settings -> CI/CD -> Variables.
    - |
      APP_NAME="$CI_PROJECT_NAME" VERSION="$CI_COMMIT_REF_NAME" COMMIT="$CI_COMMIT_SHA" \
        bash examples/report-to-panel.sh logdrop-taint.sarif
  artifacts:
    when: always          # findings fail the job; keep the report regardless
    paths:
      - logdrop-taint.sarif
    expire_in: 30 days
